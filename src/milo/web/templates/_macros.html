{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}

{% macro icon(name) %}<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "bolt" %}<path d="M13 3 5 13h6l-1 8 8-10h-6z"/>
{%- elif name == "chevron" %}<path d="m9 6 6 6-6 6"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>
{%- elif name == "send" %}<path d="m4 12 16-8-6 16-2-6z"/>
{%- elif name == "clip" %}<path d="m20 11-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/>
{%- elif name == "doc" %}<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>
{%- elif name == "user" %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "list" %}<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>
{%- elif name == "archive" %}<path d="M4 7h16v4H4zM6 11v9h12v-9M10 15h4"/>
{%- endif -%}
</svg></span>{% endmacro %}

{% macro status(value) %}<span class="chip chip-{{ value }}"><span class="dot" aria-hidden="true"></span>{{ value }}</span>{% endmacro %}
