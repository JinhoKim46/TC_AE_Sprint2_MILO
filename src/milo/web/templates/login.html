{% extends "base.html" %}{% from "_macros.html" import csrf with context %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="msg msg-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('web.login_post') }}" class="stack">
    {{ csrf() }}
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted"><a href="{{ url_for('web.signup') }}">Create an account</a> · <a href="{{ url_for('web.reset') }}">Forgot your password?</a></p>
</section>
{% endblock %}
