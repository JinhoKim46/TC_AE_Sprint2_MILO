{% extends "base.html" %}{% from "_macros.html" import csrf with context %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  {% if error %}<p class="msg msg-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('web.signup_post') }}" class="stack">
    {{ csrf() }}
    <label>First name<input type="text" name="first_name" autocomplete="given-name" required></label>
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Password (10 characters or more)<input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="muted"><a href="{{ url_for('web.login') }}">I already have an account</a></p>
</section>
{% endblock %}
