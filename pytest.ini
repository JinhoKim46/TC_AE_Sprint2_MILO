[pytest]
testpaths = tests
addopts = --disable-socket
pythonpath = src contract
markers =
    tools: kit tools tests (M3)
    security: kit security tests (M4)
    errors: kit errors tests (M5)
    sources: kit sources tests (M1, M2)
    abstains: kit abstain test (M1)
    threads: kit threads test
    cost: kit cost test
