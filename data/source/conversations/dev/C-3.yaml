- owner_text: 'Here''s the checklist I paste into the email for new cleaners: ''Subject: How we run a booking. 1. Take the booking and write it in the paper diary. 2. Check the diary the evening before so nobody is double-booked. 3. Confirm the visit by text. 4. Send a cleaner to the site with the key. 5. Send the invoice at the end of the week. Every deep clean quote has to be approved by me before it goes out. Ines types finished jobs into the spreadsheet on Friday. Please never text clients after 8pm.'''
