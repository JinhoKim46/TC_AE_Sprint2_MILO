- owner_text: 'Here is the email our customer care lead sent me last week, pasted in: ''Hi Wendell, a quick summary of how enquiries run. We use the back office of the web shop, a stock spreadsheet that each shop updates at close, and the shared inbox. Steps: the enquiry arrives, we check stock, quote a delivery date, take payment, pass it to the warehouse and send tracking. Any refund over 100 USD needs the store manager to approve it. The three things that hurt are stock counts that are outdated, endless delivery date questions and the refund queue. Thanks, Marta.'''
