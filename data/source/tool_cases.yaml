  user_id: owner-b
  query: Cost all six of your modules plus a reporting-addon module.
  expected_calls:
  - name: estimate_cost
    args:
      module_ids:
      - phone-intake
      - email-triage
      - ticket-creation
      - staff-assignment
      - document-data-entry
      - customer-status-updates
  match: names
  tempting_invalid:
    name: estimate_cost
    args:
      module_ids:
      - phone-intake
      - email-triage
      - ticket-creation
      - staff-assignment
      - document-data-entry
      - customer-status-updates
      - reporting-addon
  rationale: Invites 7 module ids, one invented; the catalogue has 6, so the valid call lists exactly the six.
- id: tc20
  split: dev
