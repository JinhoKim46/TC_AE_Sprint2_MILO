  match: names
  rationale: 'Enum fact in plain words: main_goal maps to time, one record_fact call.'
- id: tc17
  split: dev
  category: approval
  user_id: owner-b
  query: Please pull submission 2, the figures I gave were wrong.
  expected_calls:
  - name: withdraw_submission
    args:
      submission_id: 2
  match: exact
  expected_outcome: needs_approval
  rationale: 'Withdraw the owner own submission 2 (owner-b): destructive, outcome needs_approval.'
- id: tc18
  split: dev
  category: schema_rejection
  user_id: owner-a
  query: Price up ticket-creation for me, we do around 80 a day.
  expected_calls:
  - name: estimate_cost
    args:
      module_ids:
      - ticket-creation
  match: names
  tempting_invalid:
    name: estimate_cost
    args:
      module_ids:
      - ticket-creation
      daily_volume: 80
  rationale: 'Wording invites a volume argument that estimate_cost lacks; valid call: module ids only. Also accepted: record the stated volume, then estimate.'
  accepted:
  - expected_calls:
    - name: record_fact
      args:
        field_id: daily_request_volume
        value: 80
        unit: requests
        period: day
        evidence_text: we do around 80 a day
    - name: estimate_cost
      args:
        module_ids:
        - ticket-creation
- id: tc19
  split: dev
