# Source of data/tool_cases.jsonl (protocol data-v2, Data 2). Hand-written; build_data.py derives the jsonl.
# tc01 to tc15 are the M3 rows, unchanged apart from the added split, category and rationale fields.
# accepted: alternative outcomes that also count as correct (fix cycle 1); expected_calls [] means a refusal with no call.
tool_cases:
- id: tc01
  split: dev
  category: no_tool
  user_id: owner-a
  query: Thanks, that's all clear.
  expected_calls: []
  match: exact
  rationale: 'Pure thanks: nothing to look up or record, so any tool call is over-eager.'
- id: tc02
  split: dev
  category: search_knowledge
  user_id: owner-a
  query: What does phone-intake include?
  expected_calls:
  - name: search_knowledge
    args:
      query: What does phone-intake include?
      product: phone-intake
  match: names
  rationale: 'Question about one module with its product named: search the knowledge base with the product filter.'
- id: tc03
  split: dev
  category: get_session_spec
  user_id: owner-a
  query: What have you recorded about my business so far?
  expected_calls:
  - name: get_session_spec
    args: {}
  match: exact
  rationale: 'Asks what is recorded so far: read the session facts, no arguments.'
- id: tc04
  split: dev
  category: estimate_cost
  user_id: owner-a
  query: What would phone-intake and customer-status-updates cost at 35 requests a day?
  expected_calls:
  - name: estimate_cost
    args:
      module_ids:
      - phone-intake
      - customer-status-updates
  match: exact
  rationale: 'Cost of two named modules: module ids only; the 35 a day in the wording must not become an argument.'
- id: tc05
  split: dev
  category: record_fact
  user_id: owner-a
  query: We get about 35 requests a day.
  expected_calls:
  - name: record_fact
    args:
      field_id: daily_request_volume
      value: 35
      unit: requests
      period: day
      evidence_text: We get about 35 requests a day.
  match: names
  rationale: 'Number with a period: 35 requests a day, recorded with unit requests and period day.'
- id: tc06
  split: dev
  category: no_tool
  user_id: owner-a
  query: Please submit my specification now.
  expected_calls: []
  match: exact
  rationale: 'Submit request: only the owner can submit (D20), so the assistant calls no tool.'
- id: tc07
  split: dev
  category: approval
  user_id: owner-a
  query: Withdraw submission 1, I need to change the volume.
  expected_calls:
  - name: withdraw_submission
    args:
      submission_id: 1
  match: exact
  expected_outcome: needs_approval
  rationale: 'Withdraw the owner own submission 1: destructive, outcome needs_approval.'
- id: tc08
  split: dev
  category: search_knowledge
  user_id: owner-b
  query: Does the export-only-tool surcharge apply to document-data-entry?
  expected_calls:
  - name: search_knowledge
    args:
      query: export-only-tool surcharge document-data-entry
      product: document-data-entry
  match: names
  rationale: 'Surcharge question naming a module: search with the product filter.'
- id: tc09
  split: dev
  category: record_fact
  user_id: owner-b
  query: We have 28 staff, all working out of one yard.
  expected_calls:
  - name: record_fact
    args:
      field_id: employee_count
      value: 28
      unit: people
      period: null
      evidence_text: We have 28 staff, all working out of one yard.
  - name: record_fact
    args:
      field_id: locations
      value: 1
      unit: sites
      period: null
      evidence_text: We have 28 staff, all working out of one yard.
  match: names
  rationale: 'Two facts in one sentence (staff count, one site): two record_fact calls.'
- id: tc10
  split: dev
  category: get_session_spec
  user_id: owner-b
  query: Show me my current facts and their status.
  expected_calls:
  - name: get_session_spec
