# Rule 1: the whole text is one of these (after stripping punctuation and emoji); in scope, fixed reply.
greetings: [hi, hello, hey, hiya, hi there, hello there, hey there, good morning, morning, good afternoon, good evening, evening, thanks, thank you, thanks a lot, many thanks, cheers, ok thanks, thanks that helps, great thanks, bye, goodbye, see you, hola, buenos días, buenas, gracias, hallo, guten tag, guten morgen, danke, 안녕하세요, 안녕, 감사합니다, 고맙습니다]

# Rule 3: a number followed by one of these within two words ("35 a day", "3 vans", "6 minutes each").
number_units: [a day, per day, each day, /day, daily, a week, per week, a month, per month, /month, monthly, a year, per year, staff, people, employees, person, sites, locations, branches, shops, salons, vans, trucks, minutes, mins, min, hours, hrs, calls, emails, jobs, bookings, requests, tickets, orders, customers, clients, enquiries, repairs, usd, dollars, euros, percent, "%", al día, por día, al mes, por mes, personas, empleados, locales, llamadas, minutos, am tag, pro tag, im monat, pro monat, leute, mitarbeiter, standorte, filialen, anfragen, minuten, 명, 건, 통, 곳, 분]

# Rule 4: narrow refuse patterns, applied only when no lexicon term and no number-unit matched.
# Regular expressions on the case-folded text. Request-shaped, so "same story every time" does not fire.
refuse_patterns:
  - id: poem
    pattern: "\\b(write|compose|make|give|tell|sing|do|recite)\\b.{0,40}\\b(poem|poems|haiku|limerick|sonnet|song|songs|lyrics|rap|verse|ode|shanty)\\b"
  - id: joke
    pattern: "\\b(tell|write|give|know|got|have|do|make up)\\b.{0,30}\\b(a |another |some |any |one more |me a )?(joke|jokes|riddle|riddles|pun|puns)\\b"
  - id: story
    pattern: "\\b(write|tell|make up|invent|compose)\\b.{0,40}\\b(story|stories|bedtime story|fairy tale|fable|novel|screenplay|love letter)\\b"
  - id: horoscope
    pattern: "\\bhoroscopes?\\b|\\bstar sign\\b|\\bzodiac\\b"
  - id: recipe
    pattern: "\\brecipes?\\b|\\bhow (do|to) (i |you )?(cook|bake)\\b"
  - id: lyrics
    pattern: "\\blyrics\\b"
  - id: code_named_language
    pattern: "\\b(write|code|script|program|implement|debug|fix|refactor|explain)\\b.{0,50}\\b(python|javascript|typescript|java|c\\+\\+|c#|rust|golang|sql|html|css|bash|php|ruby|swift|kotlin|regex)\\b|\\b(python|javascript|typescript|java|sql|bash|css|html) (code|script|function|snippet|query)\\b|\\bregex for\\b|\\bcenter a div\\b"
  - id: homework
    pattern: "\\bhomework\\b|\\bmy (school|class|college|uni) assignment\\b|\\bwrite (me )?an essay\\b|\\bessay (on|about)\\b|\\bsolve for [a-z]\\b|\\bderivative of\\b|\\bintegral of\\b|\\bbook report\\b|\\btarea de\\b|\\bhausaufgaben\\b|\\b숙제\\b"
  - id: translation_unrelated
    pattern: "\\btranslate (this|the following|these words|this sentence)\\b.{0,80}\\b(into|to|in) (french|spanish|german|italian|portuguese|japanese|chinese|korean|english|latin|dutch)\\b"
  - id: poem_es_de_ko
    pattern: "\\b(escr[ií]beme|escribe|cu[eé]ntame|hazme)\\b.{0,30}\\b(un poema|un chiste|una historia|un cuento)\\b|\\b(schreib|schreibe|erz[aä]hl|erz[aä]hle)\\b.{0,30}\\b(ein gedicht|einen witz|eine geschichte)\\b|(시|농담|이야기).{0,6}(써|지어|들려|해)"
