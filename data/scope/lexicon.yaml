# MILO scope lexicon (SPEC D106, D110, D157; protocol evals/protocols/m5g-gate.md). Fictional.
# Read by stage 1 of the input gate (src/milo/gate/stage1.py, D128). Loadable with yaml.safe_load.
#
# Strength rule (D157, v3). Every term is `strong` or `weak`; the `strength` map below gives it per group.
# - strong: module ids and names, integration ids, protocol field ids and their synonyms, product words
#   (which here include the knowledge-base titles), session and account action words
# - weak: bare trade words and generic business words
# - Rule 2 passes a message on ONE strong term or TWO weak terms. A single weak term is not a pass: the
#   message goes to stage 2 (one Jev call). "Two weak terms" means two distinct terms matched on
#   non-overlapping spans, longest term first, so "job sheet" is one term (not `job sheet` plus `job`),
#   while "one of my staff lost a job sheet" is two (`staff`, `job sheet`).
# - Inside modules, integrations and kb_titles the id, name, title and `short_forms` take the group's
#   strength (strong); the entries' `weak_forms` are the bare or generic short forms owners also use
#   ("triage", "tickets", "templates", "api", "tier", "one off") and are weak. A term listed in both a
#   strong and a weak list is strong; the lists are kept disjoint, so this should not arise.
#
# Matching rules the gate applies to every term list below (rules 2, 3 and 4 of the protocol):
# - case-folded, word-boundary match on the owner text; every term here is lower-case
# - a short form is matched exactly like its full form; short forms sit next to the form they shorten
# - "lexicon term" means a term from ANY of modules, integrations, protocol_fields, kb_titles,
#   product_words, trade_words, generic_words, session_actions and account_actions. Session and account
#   action words are strong rule-2 terms (the old rule 5 is folded into rule 2), so "tell me a joke, then
#   send me the report" passes by rule 2 before rule 4 can fire.
# - weak terms never refuse anything. One weak term alone leaves the message undecided; the scope set
#   contains off-topic rows that collide with one weak term on purpose, so the measurement shows that
#   such text reaches stage 2 instead of bypassing it.
# - `number_units`: rule 3 fires when a digit sequence is followed (within two words) by one of these
#   units; digits only, number words ("two sites") pass by another term or go to stage 2
# - `refuse_patterns`: rule 4 only, and only when neither rule 2 nor rule 3 passed; regular expressions on
#   the case-folded text, each one verb-plus-object (a request for a joke, poem, story, song, recipe,
#   horoscope, homework, essay, code in a named language, or a translation), never a bare noun, so
#   "every recipe card gets typed up by hand" or "I know it sounds like a joke" is not refused
# - `greetings`: rule 1 fires only when the whole text (after stripping punctuation and emoji) is one of these
# - Korean units attach to particles ("30건쯤"), so a word-boundary match misses them; Korean rows that hit
#   no other term go to stage 2, which is the intended path (the protocol's Limits section)
#
# Written by a session agent on 2026-10-22 with no model call (D126). Audited with the scope set.
# v2 (fix cycle 1): product_words added; refuse patterns made verb-plus-object; action words are rule-2 terms.
# v3 (fix cycle 2, D157): strength per group; bare and generic short forms moved to `weak_forms` or
# `generic_words`; the re-key family kept only under the export-only integration (strong). Simulated with
# data/scope/tools/stage1_sim.py (no network).
# v4 (fix cycle 3, D158): 19 generic kb short forms moved to weak_forms; `short_forms` key on protocol fields
# (strong) for spreadsheets, walk-in, walkins, call-out; weak terms count by lemma.
version: scope-lexicon.v4
updated: "2026-10-22"

# D157 strength per group. Entries of modules, integrations and kb_titles: id, name, title and short_forms
# are strong; their weak_forms are weak.
strength:
  modules: strong
  integrations: strong
  protocol_fields: strong
  kb_titles: strong
  product_words: strong
  session_actions: strong
  account_actions: strong
  trade_words: weak
  generic_words: weak

modules:
  - id: phone-intake
    name: ai phone intake
    short_forms: [phone intake, call intake, call answering, answer the phones, answering the phone, call handling, out-of-hours calls, after-hours calls]
  - id: email-triage
    name: email triage
    short_forms: [inbox triage, triage the inbox, sort the inbox, label emails, draft replies, draft reply]
    weak_forms: [triage]
  - id: ticket-creation
    name: ticket creation
    short_forms: [create tickets]
    weak_forms: [tickets, ticket, ticketing, duplicate check, status tracking]
  - id: staff-assignment
    name: staff assignment
    short_forms: [assign jobs, assigning jobs, who takes which job, skill tags, override the suggestion]
    weak_forms: [assignment, availability]
  - id: document-data-entry
    name: document data entry
    short_forms: [data entry, document entry, read paper forms, scanned sheets, field extraction, flagged items, entry log]
  - id: customer-status-updates
    name: customer status updates
    short_forms: [status updates, status update, status messages, status texts, approved wording, delivery log]
    weak_forms: [templates, opt-out, opt out]

integrations:
  - id: csv-export
    name: csv export or import
    short_forms: [csv, csv export, csv import, export to csv, export a csv, csv file, csv files]
  - id: api-connector
    name: api connector
    short_forms: [api key, access key, rest api, api access]
    weak_forms: [api, an api]
  - id: crm-connector
    name: crm connector
    short_forms: [crm, a crm, our crm, field mapping, crm setup]
  - id: export-only-tool
    name: export-only tool
    short_forms: [export only, export-only, export but not import, can't import, cannot import, cant import, file drop, re-key, rekey, re-keying, rekeying, re-keyed]

