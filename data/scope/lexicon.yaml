# MILO scope lexicon (SPEC D106, D110; protocol evals/protocols/m5g-gate.md). Fictional.
# Read by stage 1 of the input gate (src/milo/gate/stage1.py, D128). Loadable with yaml.safe_load.
#
# Matching rules the gate applies to every term list below (rules 2, 3 and 5 of the protocol):
# - case-folded, word-boundary match on the owner text; every term here is lower-case
# - a short form is matched exactly like its full form; short forms sit next to the form they shorten
# - `number_units`: rule 3 fires when a number is followed (within two words) by one of these units
# - `refuse_patterns`: rule 4 only; regular expressions on the case-folded text, request-shaped,
#   never a bare noun; they never fire when rule 2 or 3 would
# - `greetings`: rule 1 fires only when the whole text (after stripping punctuation) is one of these
# - Korean units attach to particles ("30건쯤"), so a word-boundary match misses them; Korean rows that hit
#   no other term go to stage 2, which is the intended path (the protocol's Limits section)
#
# Written by a session agent on 2026-10-22 with no model call (D126). Audited with the scope set.
