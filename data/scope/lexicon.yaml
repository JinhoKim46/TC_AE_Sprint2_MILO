# Product words owners use for MILO itself (fix cycle 1): two-word forms where a bare word would collide
# ("book report", "visa fee"); bare "report", "estimate", "fee", "price" and "cost" are deliberately absent.
product_words: [module, modules, setup, set-up, contract length, minimum contract, fee per, the fee, report by, report yet, an estimate yet, the estimate yet]

# Words the demo-company owners use for their own business (D106). Weak: one alone goes to stage 2.
# (Each term is listed once: "ticket", "tickets" and the re-key family sit under their module or
# integration; "callout", "walk-ins", "spreadsheet" and "paper forms" are protocol-field synonyms, strong.)
trade_words: [booking, bookings, book in, booked, dispatch, dispatcher, job sheet, job sheets, invoice, invoices, invoicing, no-show, no-shows, no shows, van, vans, groomer, grooming, salon, salons, boiler, boilers, quote, quotes, quoting, appointment, appointments, reminder, reminders, inbox, customer, customers, client, clients, job, jobs, order, orders, request, requests, enquiry, enquiries, staff, technician, technicians, engineer, engineers, receptionist, receptionists, front desk, shift, shifts, rota, paper sheets, work order, work orders, refund, refunds, practitioner, practitioners, clinic, repair shop, repairs, yard, office staff, the office]

# Generic business words (D157, weak): words any message about work might use. Two of them, or one with
# a trade word, pass; one alone goes to stage 2.
generic_words: [business, company, firm, workshop, turnover, admin, paperwork, back office, overheads, supplier, suppliers, on paper, by hand, manually, workload, the team, my team, the desk, reception, phones, the phone, emails]

# Session actions the product offers (D98, D101, D102). Strong rule-2 terms (the old rule 5 is folded in).
session_actions: [rename, rename this session, rename the session, change the title, session title, archive, archive this, archive this session, restore, unarchive, restore the session, new diagnosis, start a new diagnosis, start over, start again, redo the diagnosis, delete this session, search my sessions, find my sessions, older sessions, open the session, which session, this session]

# Account actions (section 23, D81, D41). Strong rule-2 terms.
account_actions: [sign out, sign me out, log out, log me out, logout, sign in, my account, delete my account, delete my data, delete everything, change my email, consent, withdraw my consent, withdraw consent, export my data, submit, submission, submit this, withdraw the submission, the report, my report, send the report, send me the report, download the report, the spec, the specification, spec panel, what facts you have, my answers]

# Rule 1: the whole text is one of these (after stripping punctuation and emoji); in scope, fixed reply.
greetings: [hi, hello, hey, hiya, hi there, hello there, hey there, good morning, morning, good afternoon, good evening, evening, thanks, thank you, thanks a lot, many thanks, cheers, ok thanks, thanks that helps, great thanks, bye, goodbye, see you, hola, buenos días, buenas, gracias, hallo, guten tag, guten morgen, danke, 안녕하세요, 안녕, 감사합니다, 고맙습니다]

# Rule 3: a number followed by one of these within two words ("35 a day", "3 vans", "6 minutes each").
number_units: [a day, per day, each day, /day, daily, a week, per week, a month, per month, /month, monthly, a year, per year, staff, people, employees, person, sites, locations, branches, shops, salons, vans, trucks, minutes, mins, min, hours, hrs, calls, emails, jobs, bookings, requests, tickets, orders, customers, clients, enquiries, repairs, usd, dollars, euros, percent, "%", al día, por día, al mes, por mes, personas, empleados, locales, llamadas, minutos, am tag, pro tag, im monat, pro monat, leute, mitarbeiter, standorte, filialen, anfragen, minuten, 명, 건, 통, 곳, 분]

# Rule 4: narrow refuse patterns, applied only when rule 2 (one strong or two weak terms) and rule 3 did not pass.
# Regular expressions on the case-folded text. Every pattern is a request verb (or "my"/"me") plus the
# object, so "same story every time", "it sounds like a joke", "recipe cards", "lyrics sheets",
# "a horoscope column", "homework questions" and "a regex for the postcode check" do not fire.
refuse_patterns:
  - id: poem
    pattern: "\\b(write|compose|make|give|tell|sing|do|recite|need|want)\\b.{0,40}\\b(a |an |another |some |me a |me an )(poem|haiku|limerick|sonnet|song|rap|verse|ode|shanty)\\b|\\b(poem|haiku|limerick|sonnet|song|rap|shanty) (about|for) (my|the|a)\\b|\\b(lines|few lines) of verse\\b"
  - id: joke
    pattern: "\\b(tell|write|give|make up|hit)\\b.{0,20}\\b(me )?(a |another |some |any |one more )(joke|jokes|riddle|riddles|pun|puns)\\b|\\b(knock knock|dad) joke\\b|\\bgot any (good )?(jokes|riddles|puns)\\b"
  - id: story
    pattern: "\\b(write|tell|make up|invent|compose|need|want)\\b.{0,30}\\b(a |me a |a short |a bedtime |a horror |a love )(story|stories|fairy tale|fable|novel|screenplay|letter)\\b|\\bbedtime story (please|for)\\b|\\bstory time\\b|\\b(horror|love) (story|letter)[,.]? (three|for|to) \\b"
  - id: horoscope
    pattern: "\\b(what's|what is|whats|give me|read me|tell me|do) my (horoscope|star sign|stars)\\b|\\bmy horoscope for\\b|\\bhoroscope for (this|next|the)\\b"
  - id: recipe
    pattern: "\\b(give|send|find|share|suggest|got|need|want|have)\\b.{0,10}\\b(me )?(a |the |any )?recipes?\\b|\\bhow (do|to) (i |you )?(cook|bake) (a|an|the|some)\\b"
  - id: lyrics
    pattern: "\\b(give|send|find|write|what are|need|want)\\b.{0,10}\\b(me )?the lyrics\\b|\\blyrics (to|for|of) (a |the )\\b"
  - id: code_named_language
    pattern: "\\b(write|code|script|program|implement|debug|fix|refactor|explain)\\b.{0,50}\\b(in |a |some |this |my )?(python|javascript|typescript|java|c\\+\\+|c#|rust|golang|sql|html|css|bash|php|ruby|swift|kotlin) (code|script|function|class|snippet|query|promise)\\b|\\b(write|code|debug|fix|explain)\\b.{0,30}\\b(python|javascript|typescript|java|sql|bash|css|html|php|ruby|rust|kotlin|swift)\\b|\\b(write|give me|need|want) (me )?(a )?regex\\b|\\bregex for matching\\b|\\bhow do i center a div\\b|\\b(my|this) (python|javascript|sql|bash) (code|script|promise)\\b"
  - id: homework
    pattern: "\\b(do|help with|help me with|finish|check|mark) my (history |maths |math |science |english )?homework\\b|\\bmy homework (is|for|on)\\b|\\bmy (school|class|college|uni) assignment\\b|\\bwrite (me )?an essay\\b|\\bessay (on|about) .{0,40}\\b(words|pages|for school|for class)\\b|\\bsolve for [a-z]\\b|\\b(what's|what is|find|compute|give me) the (derivative|integral) of\\b|\\bderivative of [a-z0-9 ]{1,30}\\?|\\bfor my book report\\b|\\b(ayudas|ayuda|ayúdame) con mi tarea\\b|\\bpara el colegio\\b|\\b(mach|mache|hilf mir bei) (meine|meinen) hausaufgaben\\b|숙제.{0,6}(해줘|도와|풀어)"
  - id: translation_unrelated
    pattern: "\\btranslate (this|the following|these words|this sentence)\\b.{0,80}\\b(into|to|in) (french|spanish|german|italian|portuguese|japanese|chinese|korean|english|latin|dutch)\\b"
  - id: poem_es_de_ko
    pattern: "\\b(escr[ií]beme|escribe|cu[eé]ntame|hazme|necesito|quiero)\\b.{0,30}\\b(un poema|un chiste|una historia|un cuento)\\b|\\b(schreib|schreibe|erz[aä]hl|erz[aä]hle)\\b.{0,30}\\b(ein gedicht|einen witz|eine geschichte)\\b|(시|농담|이야기).{0,6}(써|지어|들려|해)"
